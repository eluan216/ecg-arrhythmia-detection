name: Full MIT-BIH evaluation

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/mitbih-evaluation.yml"
      - "src/data/**"
      - "src/eval/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mitbih:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python -m pip install numpy scikit-learn wfdb joblib black==24.8.0 ruff==0.6.9
      - name: Check evaluation runner
        run: |
          ruff check src/eval/full_mitbih.py
          black --check --diff src/eval/full_mitbih.py
      - name: Run full real-data protocol
        run: python -m src.eval.full_mitbih
      - name: Save measured results and model
        uses: actions/upload-artifact@v4
        with:
          name: full-mitbih-results
          path: artifacts/full-mitbih/
          if-no-files-found: error
          retention-days: 30
