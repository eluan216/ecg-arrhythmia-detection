name: Reproducible research experiments

on:
  push:
    branches: [main, "improve/**"]
    paths:
      - "src/data/research.py"
      - "src/eval/research_suite.py"
      - "src/eval/protocols.py"
      - "src/eval/cnn_diagnostics.py"
      - "tests/test_review_protocols.py"
      - ".github/workflows/research.yml"
      - "src/eval/external.py"
      - "src/models/artifacts.py"
      - "src/eval/statistics.py"
      - "src/data/segment.py"
      - "src/models/cnn_pytorch.py"
      - "constraints-research.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed scientific environment
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-research.txt numpy scipy scikit-learn pandas joblib wfdb matplotlib pytest
      - name: Verify record protocols and class accounting
        run: python -m pytest tests/test_review_protocols.py -q
      - name: Compare models and rhythm features
        run: python -m src.eval.research_suite --download --epochs 10 --bootstrap 200
      - name: Compare published DS1/DS2 (known shared subject 201/202)
        run: python -m src.eval.research_suite --protocol ds1-ds2 --output-dir artifacts/ds1-ds2 --epochs 10 --bootstrap 200
      - name: Compare subject-disjoint DS1/DS2 variant
        run: python -m src.eval.research_suite --protocol ds1-ds2-disjoint --output-dir artifacts/ds1-ds2-disjoint --epochs 10 --bootstrap 200
      - name: Diagnose CNN normalization and window length on validation subjects
        run: python -m src.eval.cnn_diagnostics --epochs 10
      - name: Summarize protocol comparison
        run: python -m src.eval.protocol_comparison
      - name: Test noise robustness on unseen clean sources
        run: python -m src.eval.external --dataset nstdb --download --data-dir data/nstdb --output artifacts/research/nstdb.json
      - name: Test frozen models on all INCART records
        run: python -m src.eval.external --dataset incartdb --download --data-dir data/incart --output artifacts/research/incart.json
      - name: Render figures
        run: python -m src.eval.plots
      - name: Upload research bundle and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecg-research-bundle
          path: |
            artifacts/research/
            artifacts/figures/
            artifacts/ds1-ds2/
            artifacts/ds1-ds2-disjoint/
            artifacts/cnn-diagnostics.json
            artifacts/protocol-comparison.md
          if-no-files-found: error
          retention-days: 30
